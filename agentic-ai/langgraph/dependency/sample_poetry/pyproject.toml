[project]
name = "dep-demo"
version = "0.1.0"
description = "Poetry dependency-management demo"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
]

[tool.poetry]
packages = [{ include = "dep_demo", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
