# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate dep-demo
# Export a fully-pinned, reproducible copy of what you actually have:
#   conda env export --no-builds > environment.lock.yml
name: dep-demo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scikit-learn
  - cudatoolkit=11.8   # a non-Python, compiled binary dependency — this is
                        # the whole reason conda exists; pip/poetry/uv only
                        # manage Python packages, not system/CUDA libraries
  - pip
  - pip:
      # anything not packaged for conda-forge can still be layered in via pip
      - rich
