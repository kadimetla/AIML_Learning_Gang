# Production reverse proxy for web_hybrid: one public origin, FastAPI stays private.
#
#   https://app.example.com/            → the built UI (npm run build → dist/)
#   https://app.example.com/agent       → FastAPI :8001/agent    (AG-UI, streamed over SSE)
#   https://app.example.com/inventory   → FastAPI :8001/inventory
#
# The browser only ever sees this origin, so FastAPI needs no CORS entry for it and can
# listen on 127.0.0.1 (or a private network) only.
#
# Example only: this file has not been tested; adjust the domain, certificate paths and dist path.

upstream agent_service {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate     /etc/ssl/certs/app.example.com.pem;
    ssl_certificate_key /etc/ssl/private/app.example.com.key;

    # the built Vite app
    root /srv/cloud_provisioner/web_hybrid/dist;
    location / {
        try_files $uri /index.html;
    }

    # AG-UI: a long-lived POST whose response is an SSE stream
    location = /agent {
        # auth belongs here or in FastAPI, before the graph runs (see notes below)
        proxy_pass http://agent_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: send each event as it arrives instead of buffering the whole response
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # a run can wait on the LLM and on cloud calls (RDS takes minutes on real AWS)
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        client_max_body_size 2m;  # the request carries the whole message history
    }

    location = /inventory {
        proxy_pass http://agent_service;
        proxy_set_header Host $host;
    }
}

# Notes
# - Auth: either validate the session/JWT here (e.g. auth_request to an auth service, or
#   oauth2-proxy in front), or in server.py before agent.run(). Either way, take the user's
#   identity from what the proxy verified, never from the request body.
# - Rate limits: limit_req on /agent protects the LLM bill.
# - Several agent servers: add them to the upstream block; keep one thread on one server
#   only if the checkpointer is local SQLite (use Postgres to share threads across servers).
