[project]
name = "ragstore"
version = "0.1.0"
description = "Shared config, embeddings and pluggable vector store (chroma / qdrant / pgvector)"
requires-python = ">=3.12"
dependencies = ["langchain-core>=0.3", "langchain-openai>=0.3", "python-dotenv>=1.0"]

[project.optional-dependencies]
chroma = ["langchain-chroma>=0.2"]
qdrant = ["langchain-qdrant>=0.2", "qdrant-client>=1.9"]
pgvector = ["langchain-postgres>=0.0.12", "psycopg[binary]>=3.2"]
all = ["ragstore[chroma,qdrant,pgvector]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ragstore"]
