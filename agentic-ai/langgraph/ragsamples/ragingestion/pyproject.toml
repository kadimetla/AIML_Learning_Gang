[project]
name = "ragingestion"
version = "0.1.0"
description = "Load -> chunk -> embed -> store documents (CLI + FastAPI upload service)"
requires-python = ">=3.12"
dependencies = [
    "ragstore[all]",
    "langchain-text-splitters>=0.3",
    "langchain-core>=0.3",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
    "docling>=2.139.0",
]

[project.scripts]
ragingest = "ragingestion.cli:main"
ragingestion-api = "ragingestion.api:serve"

[tool.uv.sources]
ragstore = { path = "../ragstore", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ragingestion"]
