[project]
name = "ragquery"
version = "0.1.0"
description = "Agentic RAG with LangGraph: route -> retrieve -> grade -> rewrite -> answer with citations"
requires-python = ">=3.12"
dependencies = [
    "ragstore[all]",
    "langgraph>=0.2",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
ragquery-api = "ragquery.api:serve"
ragask = "ragquery.cli:main"

[tool.uv.sources]
ragstore = { path = "../ragstore", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ragquery"]
